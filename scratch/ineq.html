<!doctype html>
<html><head><meta charset="utf-8"><title>不等式的性质：效果原型</title>
<style>
html,body{margin:0;height:100%;background:#c99d6e;overflow:hidden;font-family:"Songti SC","STSong",serif}
canvas{display:block;touch-action:none}
#panel{position:fixed;right:22px;top:50%;transform:translateY(-50%);width:304px;background:#fbf7ec;color:#262c3c;border-radius:3px;box-shadow:0 10px 30px rgba(40,30,15,.28),0 0 0 1px rgba(120,100,60,.18);padding:16px 18px 14px;box-sizing:border-box;user-select:none;opacity:0}
#panel h4{margin:0 0 8px;font:600 15px "Songti SC",serif;color:#6b5a3e;letter-spacing:1px}
.ops{display:flex;gap:6px;margin-bottom:8px}
.ops button{flex:1;height:34px;border:1px solid rgba(38,44,60,.35);background:#fffdf6;border-radius:3px;font:600 21px "Times New Roman","Songti SC",serif;color:#262c3c;cursor:pointer;padding:0}
.ops button.on{background:#262c3c;color:#fbf7ec;border-color:#262c3c}
#ruler{position:relative;height:46px;margin:2px 6px 2px;cursor:pointer;touch-action:none}
#ruler .line{position:absolute;left:0;right:0;top:13px;height:2px;background:#262c3c}
#ruler .tk{position:absolute;top:7px;width:1.5px;height:14px;margin-left:-.75px;background:#262c3c}
#ruler .tk.sm{top:10px;height:8px}
#ruler .lb{position:absolute;top:24px;transform:translateX(-50%);font:13px "Times New Roman",serif;color:#262c3c;white-space:nowrap}
#ruler .knob{position:absolute;top:4px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#e0a526;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left .15s,opacity .3s;opacity:0}
#ruler.pulse .knob{animation:kp 1.1s ease-in-out infinite}
@keyframes kp{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
#opshow{text-align:center;font:600 26px "Times New Roman","Songti SC",serif;margin:0 0 2px;min-height:32px}
#conv{text-align:center;font:14px "Songti SC",serif;color:#8a7a5c;min-height:19px}
hr{border:0;border-top:1px dashed rgba(38,44,60,.25);margin:9px 0}
.rw{display:flex;align-items:baseline;gap:8px;font:20px "Times New Roman","Songti SC",serif;margin:4px 0;min-height:26px}
.rw .k{font:14px "Songti SC",serif;color:#8a7a5c;width:30px;flex:none}
.rw.v{font-size:17px;color:#55596a;min-height:22px}
.m{color:#d12a74}.c{color:#1b8fc2}.g{color:#b07a0a}
#dir{margin-top:6px;font:15px "Songti SC",serif;min-height:22px}
#dir b{padding:1px 7px;border-radius:2px;font-weight:600}
#dir b.chg{background:#f4c24a}
#letters{display:none;margin-top:10px;width:100%;height:32px;border:1px dashed rgba(38,44,60,.45);background:transparent;font:15px "Songti SC",serif;color:#262c3c;cursor:pointer;border-radius:3px}
#letters.on{background:#262c3c;color:#fbf7ec;border-style:solid}
.slip{position:fixed;left:0;top:0;pointer-events:none;font:17px/1.3 "Hannotate SC","HanziPen SC","Kaiti SC","STKaiti",serif;color:#2c3245;background:#fdf3c4;padding:7px 12px 6px;border-radius:2px;box-shadow:0 2px 8px rgba(40,30,15,.22);white-space:nowrap;opacity:0;transition:opacity .35s}
.slip::after{content:"";position:absolute;left:50%;top:-4px;width:14px;height:7px;margin-left:-7px;background:rgba(230,215,170,.75);transform:rotate(-4deg)}
</style></head>
<body>
<div id="panel">
  <h4>两边同时</h4>
  <div class="ops"><button data-op="+">+</button><button data-op="−">−</button><button data-op="×">×</button><button data-op="÷">÷</button></div>
  <div id="ruler"><div class="line"></div><div class="knob"></div></div>
  <div id="opshow"></div><div id="conv"></div>
  <hr>
  <div class="rw"><span class="k">原来</span><span id="was"></span></div>
  <div class="rw"><span class="k">现在</span><span id="now"></span></div>
  <div class="rw v"><span class="k"></span><span id="vals"></span></div>
  <div id="dir"></div>
  <button id="letters">把两个数换成字母 a、b</button>
</div>
<div class="slip" id="slipC">把 5 换成 −5 试试</div>
<div class="slip" id="slipB">珠子也能拖：换一些其他数，验证这个发现</div>
<script type="module">
// 效果原型（还不是活页）：七下 11.1.2 不等式的性质（第 124–125 页）。
// 一根数轴横跨两页上面的页边，0 在书脊上：右边正数，左边负数。两颗珠子是不等式两边的两个数。
// 这一课的三条性质 = 数轴上的三种动作：加减一个数 = 两颗一起挪；乘正数 = 从 0 往外拉／往里收；乘负数 = 拉完再沿半圆跳到 0 的另一边。
// 乘 0 = 全收到 0；减法 = 加它的相反数；除法 = 乘它的倒数（转化）；两颗在同一点（等式）= 怎么做都还在一起（类比）。
// 开场先演课本第一个空（6＞2，两边乘 5），再把第二个空 ×(−5) 交给学生。
// 学生做到课本哪个空，书上那个空就填上；每种都试过两回，课本那句结论亮起来；乘法两种都有了，可以把 6、2 换成字母 a、b（例 2）。
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#c99d6e');
const camQ = (Q.get('cam') || '0,0.86,0.7,0,0.09,-0.06,32').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(camQ[6] || 30, innerWidth / innerHeight, 0.01, 10);
cam.position.set(camQ[0], camQ[1], camQ[2]); cam.lookAt(camQ[3], camQ[4], camQ[5]);
cam.setViewOffset(innerWidth, innerHeight, 165, 0, innerWidth, innerHeight); // 右边留给纸片
scene.add(new THREE.HemisphereLight(0xfff8ee, 0xa58a68, 1.5));
const sun = new THREE.DirectionalLight(0xfff2de, 1.45); sun.position.set(-0.3, 1.6, 0.7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -0.55, right: 0.55, top: 0.55, bottom: -0.55, near: 0.1, far: 3 }); sun.shadow.bias = -0.0004; scene.add(sun);

const C = { cyan: '#1b8fc2', mag: '#d12a74', gold: '#b07a0a', ink: '#262c3c' };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const NUMF = '"Times New Roman","Songti SC",serif', KAI = '"Kaiti SC","STKaiti",serif';
const fmt = (v) => { const r = Math.round(v * 100) / 100, s = Math.abs(r).toString(); return r < 0 ? '−' + s : s; };
const par = (v) => (v < 0 ? `(${fmt(v)})` : fmt(v));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2);
const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));

// ---- 书 ----
const PW = 0.3, s = PW / 521.55, PH = 736.95 * s, GAP = 0.004;
const desk = new THREE.Mesh(new THREE.PlaneGeometry(4, 4).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xc99d6e })); desk.position.y = -0.026; desk.receiveShadow = true; scene.add(desk);
const loader = new THREE.TextureLoader(); let loaded = 0;
for (const [i, side] of [[130, -1], [131, 1]]) {
  const t = loader.load(`/books/shuxue-7x/hi/${i}.png`, () => loaded++); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  const pg = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: t })); pg.position.set(side * (PW / 2 + GAP), 0, 0); pg.receiveShadow = true; scene.add(pg);
  const block = new THREE.Mesh(new THREE.BoxGeometry(PW + 0.002, 0.024, PH + 0.002), new THREE.MeshLambertMaterial({ color: 0xf1ead8 })); block.position.set(side * (PW / 2 + GAP), -0.0125, 0); block.castShadow = block.receiveShadow = true; scene.add(block);
}
const L = (px, py, y = 0.0006) => V(-PW / 2 - GAP + (px - 260.78) * s, y, (py - 368.48) * s);
const R = (px, py, y = 0.0006) => V(PW / 2 + GAP + (px - 260.78) * s, y, (py - 368.48) * s);
const glow = (w, h, p) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w * s, h * s).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xf4c24a, transparent: true, opacity: 0, depthWrite: false })); m.position.copy(p); m.userData.to = 0; scene.add(m); return m; };
const G = {
  open: glow(412, 36, L(250, 70)), sub: glow(350, 36, L(219, 340)), p1: glow(275, 40, L(178, 408)),
  fact: glow(30, 15, L(117.6, 573)), a5: glow(30, 15, L(117.4, 594)), rowN: glow(148, 22, L(174, 614)),
  div: glow(265, 80, R(200, 110)), note: glow(134, 101, R(404, 97)), p2: glow(412, 36, R(271, 174)), p3: glow(412, 36, R(271, 259)),
  ex1: glow(205, 36, R(191, 428)), ex2: glow(205, 36, R(191, 470)),
};
const inkTex = (txt, w, h) => canvasTex(w, h, (g) => { g.fillStyle = C.ink; g.font = `700 ${Math.round(h * 0.8)}px ${KAI}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w / 2, h * 0.55); });
const stamp = (txt, p, wide) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(wide ? 0.026 : 0.013, 0.013).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, map: inkTex(txt, wide ? 256 : 128, 128) })); m.position.copy(p); m.userData.on = 0; m.userData.want = false; scene.add(m); return m; };
// 课本第 124 页上的十个空：第一个数、第二个数、加还是乘、那个数，空在哪
const val = (x, kind, v) => (kind === 'mul' ? x * v : x + v);
const CASES = [
  [5, 3, 'add', 2, L(147, 217)], [5, 3, 'add', 0, L(147, 238.2)], [5, 3, 'add', -2, L(171.2, 259.4)],
  [-1, 3, 'add', 4, L(327.9, 217)], [-1, 3, 'add', 0, L(327.7, 238.2)], [-1, 3, 'add', -7, L(351.5, 259.4)],
  [6, 2, 'mul', 5, L(147.4, 593.5)], [6, 2, 'mul', -5, L(171.2, 614.5)], [-2, 3, 'mul', 4, L(327.7, 593.5)], [-2, 3, 'mul', -0.5, L(360.9, 614.5)],
].map(([a, b, kind, v, p]) => ({ a, b, kind, v, st: stamp(val(a, kind, v) > val(b, kind, v) ? '＞' : '＜', p.setY(0.0009)) }));
const CONCL = { add: stamp('不变', L(164.3, 309.3, 0.0009), true), pos: stamp('不变', L(423.6, 643.7, 0.0009), true), neg: stamp('改变', L(283.7, 664.9, 0.0009), true) };

// ---- 一根数轴：横跨两页上面的页边，0 在书脊上（只压住页眉） ----
const U = 0.01, HALF = 0.36, SD = 0.032, SZ0 = -0.219, ZL = SZ0 + (110 / 320) * SD, TOP = 0.0022;
const axisTex = canvasTex(7200, 320, (g, W) => {
  g.fillStyle = '#fbf6e8'; g.fillRect(0, 0, W, 320);
  const px = (n) => W / 2 + (n * U * W) / (2 * HALF), base = 110;
  g.strokeStyle = C.ink; g.fillStyle = C.ink; g.lineWidth = 6; g.beginPath(); g.moveTo(0, base); g.lineTo(W, base); g.stroke();
  g.font = `600 120px ${NUMF}`; g.textAlign = 'center';
  for (let n = -36; n <= 36; n++) { const x = px(n), five = n % 5 === 0; g.lineWidth = five ? 6 : 3; g.beginPath(); g.moveTo(x, base); g.lineTo(x, base + (five ? 50 : 26)); g.stroke(); if (five) { g.save(); g.translate(x, 292); g.scale(1, 1.25); g.fillText(fmt(n), 0, 0); g.restore(); } }
});
const side = new THREE.MeshLambertMaterial({ color: 0xe6dcc2 });
const strip = new THREE.Mesh(new THREE.BoxGeometry(2 * HALF, 0.0016, SD), [side, side, new THREE.MeshLambertMaterial({ map: axisTex }), side, side, side]);
strip.position.set(0, 0.0014, SZ0 + SD / 2); strip.castShadow = strip.receiveShadow = true; scene.add(strip);

// ---- 两颗珠子：原来的数（数轴上一个圈）和做完以后的数（实心珠子） ----
const R0 = 0.0062;
const mkBall = (col) => { const m = new THREE.Mesh(new THREE.SphereGeometry(R0, 30, 20), new THREE.MeshStandardMaterial({ color: col, roughness: 0.3 })); m.castShadow = true; scene.add(m); return m; };
const mkRing = (col) => { const m = new THREE.Mesh(new THREE.TorusGeometry(R0 * 1.05, 0.0012, 10, 32).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: col, roughness: 0.4 })); scene.add(m); return m; };
const BALL = [mkBall(C.mag), mkBall(C.cyan)], RING = [mkRing(C.mag), mkRing(C.cyan)];
const pickMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
const PICK = [0, 1].map((i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), pickMat); m.userData.i = i; scene.add(m); return m; });
const texCache = new Map();
const tagTex = (txt, color) => { const key = txt + color; if (!texCache.has(key)) { const f = `700 120px ${NUMF}`, g0 = document.createElement('canvas').getContext('2d'); g0.font = f; const w = Math.ceil(g0.measureText(txt).width) + 40; texCache.set(key, [canvasTex(w, 160, (g) => { g.font = f; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = 'rgba(251,247,236,0.96)'; g.strokeText(txt, w / 2, 86); g.fillStyle = color; g.fillText(txt, w / 2, 86); }), w / 160]); } return texCache.get(key); };
const mkTag = (h) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ depthTest: false, transparent: true })); sp.renderOrder = 9; sp.userData.h = h; scene.add(sp); return sp; };
const setTag = (sp, txt, color) => { if (sp.userData.k === txt + color) return; sp.userData.k = txt + color; const [t, a] = tagTex(txt, color); sp.material.map = t; sp.material.needsUpdate = true; sp.scale.set(sp.userData.h * a, sp.userData.h, 1); };
const TAG = [mkTag(0.02), mkTag(0.02)], OTAG = [mkTag(0.013), mkTag(0.013)];
// 走过的路：留在数轴上的细线、跳过去的半圆
const trails = new THREE.Group(); scene.add(trails);
const trailMat = [C.mag, C.cyan].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.5, transparent: true, opacity: 0.6 }));
const DZ = [-0.0016, 0.0016];
// 珠子走到哪，线就画到哪（跳的时候像笔跟着画出一道半圆）
const arcMesh = (i, x) => { const r = Math.abs(x) * U; if (r < 1e-4) return null; const pts = []; for (let k = 0; k <= 48; k++) { const th = (Math.PI * k) / 48; pts.push(V(x * U * Math.cos(th), TOP + R0 + r * Math.sin(th), ZL + DZ[i])); } const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, 0.0009, 8); g.setDrawRange(0, 0); const m = new THREE.Mesh(g, trailMat[i]); m.userData.total = g.index.count; trails.add(m); return m; };
const slideMesh = (i) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.0008, 0.0008, 1, 8).rotateZ(Math.PI / 2), trailMat[i]); m.scale.x = 1e-4; trails.add(m); return m; };
function drawTrail(st, p) {
  if (!st.live) st.live = [0, 1].map((i) => (st.kind === 'jump' ? arcMesh(i, st.from[i]) : slideMesh(i)));
  st.live.forEach((m, i) => { if (!m) return;
    if (st.kind === 'jump') m.geometry.setDrawRange(0, Math.floor((m.userData.total * p) / 48) * 48);
    else { const x0 = st.from[i], x1 = S.cur[i]; m.scale.x = Math.max(1e-4, Math.abs(x1 - x0) * U); m.position.set(((x0 + x1) / 2) * U, TOP + 0.0009, ZL + DZ[i] * 2.8); } });
}

// ---- 状态 ----
const RANGE = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const STOPS = { '+': RANGE(-8, 8), '−': RANGE(-8, 8), '×': [-5, -4, -3, -2, -1, -0.5, 0, 0.5, 1, 2, 3, 4, 5], '÷': [-5, -4, -2, -1, -0.5, 0.5, 1, 2, 4, 5] };
const END = 3.9;
const S = { t: Q.get('intro') === '0' ? END : 0, a: 6, b: 2, op: '×', c: 5, cur: [6, 2], steps: [], si: 0, st: 0, busy: false, atResult: false, handed: false, panelOn: false, touchedC: false, touchedB: false, ops: 0, letters: false, introRun: false, cnt: { add: new Set(), pos: new Set(), neg: new Set() }, hold: false };
const mulOf = (op, c) => (op === '×' ? c : op === '÷' ? 1 / c : null);
const addOf = (op, c) => (op === '+' ? c : op === '−' ? -c : null);
const apply = (x, op, c) => (mulOf(op, c) != null ? x * mulOf(op, c) : x + addOf(op, c));
function planFor(a, b, op, c) {
  const steps = [];
  if (addOf(op, c) != null) { const v = addOf(op, c); if (v) steps.push({ kind: 'slide', from: [a, b], to: [a + v, b + v], dur: 0.55 + 0.04 * Math.abs(v) }); return steps; }
  const m = mulOf(op, c), k = Math.abs(m);
  if (k !== 1) steps.push({ kind: 'stretch', from: [a, b], to: [a * k, b * k], dur: 0.8 });
  if (m < 0) steps.push({ kind: 'jump', from: [a * k, b * k], to: [-a * k, -b * k], dur: 1.1 });
  return steps;
}
function run() { // 从原来的位置重新做一遍
  trails.clear(); S.cur = [S.a, S.b]; S.steps = planFor(S.a, S.b, S.op, S.c); S.si = 0; S.st = 0; S.busy = true; S.atResult = false; readout(false);
}
function finish() {
  S.busy = false; S.atResult = true; S.cur = [apply(S.a, S.op, S.c), apply(S.b, S.op, S.c)]; readout(true);
  if (S.introRun) { S.introRun = false; return; }
  if (!S.handed) return;
  S.ops++;
  const { a, b, op, c } = S, m = mulOf(op, c), v = addOf(op, c);
  for (const k of CASES) if (k.a === a && k.b === b && ((k.kind === 'add' && v === k.v) || (k.kind === 'mul' && m === k.v))) k.st.userData.want = true;
  if (a !== b) { const key = `${a},${b},${op},${c}`; if (v != null) S.cnt.add.add(key); else if (m > 0) S.cnt.pos.add(key); else if (m < 0) S.cnt.neg.add(key); }
  if (S.cnt.add.size >= 2) CONCL.add.userData.want = true;
  if (S.cnt.pos.size >= 2) CONCL.pos.userData.want = true;
  if (S.cnt.neg.size >= 2) CONCL.neg.userData.want = true;
  if (CONCL.pos.userData.want && CONCL.neg.userData.want) document.getElementById('letters').style.display = 'block';
}

// ---- 纸片：两边同时 + − × ÷ 几 ----
const $ = (id) => document.getElementById(id);
const ruler = $('ruler'), knob = ruler.querySelector('.knob'), panel = $('panel');
let RU = { lo: -5, hi: 5, W: 260 };
function buildRuler() {
  ruler.querySelectorAll('.tk,.lb').forEach((e) => e.remove());
  const add = addOf(S.op, 1) != null, lo = add ? -8 : -5, hi = add ? 8 : 5, W = ruler.clientWidth || 260;
  RU = { lo, hi, W };
  for (const v of STOPS[S.op]) { const x = ((v - lo) / (hi - lo)) * W, lab = add ? v % 2 === 0 : Number.isInteger(v);
    const t = document.createElement('div'); t.className = 'tk' + (lab ? '' : ' sm'); t.style.left = x + 'px'; ruler.append(t);
    if (lab) { const l = document.createElement('div'); l.className = 'lb'; l.textContent = fmt(v); l.style.left = x + 'px'; ruler.append(l); } }
  placeKnob();
}
const placeKnob = () => { knob.style.left = ((S.c - RU.lo) / (RU.hi - RU.lo)) * RU.W + 'px'; knob.style.opacity = S.panelOn ? 1 : 0; };
const nearest = (v) => STOPS[S.op].reduce((b, x) => (Math.abs(x - v) < Math.abs(b - v) ? x : b), STOPS[S.op][0]);
const frac = (x) => ({ 0.25: '1/4', 0.2: '1/5', 0.5: '1/2' })[Math.abs(x)];
function showOp() {
  document.querySelectorAll('.ops button').forEach((b) => b.classList.toggle('on', S.panelOn && b.dataset.op === S.op));
  $('opshow').innerHTML = S.panelOn ? `${S.op} <span class="g">${par(S.c)}</span>` : '';
  const r = 1 / S.c, rr = frac(r) ? (r < 0 ? `(−${frac(r)})` : frac(r)) : par(r);
  $('conv').textContent = !S.panelOn ? '' : S.op === '−' ? `减 ${par(S.c)}，就是加 ${par(-S.c)}` : S.op === '÷' ? `除以 ${par(S.c)}，就是乘 ${rr}` : '';
}
function setOp(op, c = S.c) { S.op = op; S.c = nearest(c); buildRuler(); showOp(); run(); }
const sgn = (x, y) => (x > y ? '＞' : x < y ? '＜' : '＝');
function exprOf(x, l, col) {
  const op = S.op, c = S.c;
  if (!S.letters) return `<span class="${col}">${fmt(x)}</span>${op}<span class="g">${par(c)}</span>`;
  if (op === '×' && c !== 0) return `<span class="g">${c === 1 ? '' : c === -1 ? '−' : fmt(c)}</span><span class="${col}">${l}</span>`;
  return `<span class="${col}">${l}</span>${op}<span class="g">${par(c)}</span>`;
}
function readout(done) {
  const { a, b } = S, la = S.letters ? 'a' : fmt(a), lb = S.letters ? 'b' : fmt(b);
  $('was').innerHTML = `<span class="m">${la}</span> ${sgn(a, b)} <span class="c">${lb}</span>`;
  if (!done) { $('now').innerHTML = ''; $('vals').innerHTML = ''; $('dir').innerHTML = ''; return; }
  const ra = apply(a, S.op, S.c), rb = apply(b, S.op, S.c), s2 = sgn(ra, rb), same = s2 === sgn(a, b);
  $('now').innerHTML = `${exprOf(a, 'a', 'm')} ${s2} ${exprOf(b, 'b', 'c')}`;
  $('vals').innerHTML = S.letters ? '' : `<span class="m">${fmt(ra)}</span> ${s2} <span class="c">${fmt(rb)}</span>`;
  $('dir').innerHTML = a === b ? '原来相等，做完还相等' : s2 === '＝' ? '两边都成了 0，相等了' : `不等号的方向：<b class="${same ? '' : 'chg'}">${same ? '没变' : '变了'}</b>`;
}
const touchC = () => { S.touchedC = true; ruler.classList.remove('pulse'); };
document.querySelectorAll('.ops button').forEach((b) => b.addEventListener('click', () => { if (!S.handed) return skip(); touchC(); setOp(b.dataset.op); }));
let rDrag = false;
const cFromX = (e) => { const r = ruler.getBoundingClientRect(); return nearest(RU.lo + ((e.clientX - r.left) / r.width) * (RU.hi - RU.lo)); };
const pickC = (e) => { const c = cFromX(e); if (c !== S.c) { touchC(); S.c = c; placeKnob(); showOp(); run(); } };
ruler.addEventListener('pointerdown', (e) => { if (!S.handed) return skip(); rDrag = true; ruler.setPointerCapture(e.pointerId); pickC(e); });

$('letters').addEventListener('click', () => { S.letters = !S.letters; $('letters').classList.toggle('on', S.letters); $('letters').textContent = S.letters ? '换回数字' : '把两个数换成字母 a、b'; readout(S.atResult); });

// ---- 在书上拖珠子：换原来的数 ----
const ray = new THREE.Raycaster(), mp = new THREE.Vector2(), hp = new THREE.Vector3(), plane = new THREE.Plane(V(0, 1, 0), -TOP);
const aim = (e) => { mp.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mp, cam); };
let bDrag = -1;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!S.handed) return skip();
  aim(e); const h = ray.intersectObjects(PICK)[0]; if (!h) return;
  bDrag = h.object.userData.i; S.touchedB = true; S.noteUntil = S.noteUntil || S.t + 3; renderer.domElement.setPointerCapture(e.pointerId);
  trails.clear(); S.busy = false; S.steps = []; S.atResult = false; S.cur = [S.a, S.b]; readout(false);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  aim(e);
  if (bDrag >= 0) { if (ray.ray.intersectPlane(plane, hp)) { const v = Math.max(-6, Math.min(6, Math.round(hp.x / U))); if (bDrag === 0) S.a = v; else S.b = v; S.cur = [S.a, S.b]; readout(false); } return; }
  document.body.style.cursor = S.handed && ray.intersectObjects(PICK)[0] ? 'grab' : '';
});
renderer.domElement.addEventListener('pointerup', () => { if (bDrag >= 0) { bDrag = -1; run(); } });
function skip() { S.t = Math.max(S.t, END); }

// ---- 开场：先演课本第一个空，再把第二个空交给学生 ----
let introStep = 0;
function director() {
  const t = S.t;
  strip.scale.x = 0.02 + 0.98 * ease(seg(t, 0.2, 0.8));
  const pop = Math.max(0.001, ease(seg(t, 0.9, 1.2)));
  for (let i = 0; i < 2; i++) { BALL[i].scale.setScalar(pop); RING[i].scale.setScalar(pop); }
  panel.style.opacity = seg(t, 0.8, 1.2);
  G.fact.userData.to = t > 0.9 && t < 1.9 && !S.handed ? 0.42 : 0; G.a5.userData.to = t >= 1.9 && !S.handed ? 0.42 : 0;
  if (introStep === 0 && t >= 1.9) { introStep = 1; S.panelOn = true; S.op = '×'; S.c = 5; buildRuler(); showOp(); }
  if (introStep === 1 && t >= 2.2) { introStep = 2; S.introRun = true; run(); }
  if (introStep === 2 && t >= 3.1) CASES[6].st.userData.want = true;
  if (introStep === 2 && t >= END) { introStep = 3; if (!S.atResult) { S.introRun = true; run(); } CASES[6].st.userData.want = true; S.handed = true; ruler.classList.add('pulse'); }
}

// ---- 每一帧 ----
const tipC = $('slipC'), tipB = $('slipB');
function coefLabel(i) { const l = i ? 'b' : 'a', m = mulOf(S.op, S.c), v = addOf(S.op, S.c); if (S.op === '÷') return `${l}÷${par(S.c)}`; if (m != null) return m === 0 ? '0' : m === 1 ? l : m === -1 ? `−${l}` : `${fmt(m)}${l}`; return v === 0 ? l : `${l}${v < 0 ? '−' : '+'}${fmt(Math.abs(v))}`; }
function layout(dt) {

      S.jumpTh = st.kind === 'jump' ? Math.PI * p : 0; drawTrail(st, p);
      if (S.st >= 1) { S.si++; S.st = 0; S.jumpTh = 0; }
    }
  }
  const st = S.busy && S.steps[S.si];
  const close = Math.abs(S.cur[0] - S.cur[1]) * U < 0.03, oclose = Math.abs(S.a - S.b) * U < 0.03;
  for (let i = 0; i < 2; i++) {
    const o = i === 0 ? S.a : S.b;
    RING[i].position.set(o * U, TOP + 0.0012, ZL + DZ[i]); PICK[i].position.copy(RING[i].position);
    let x = S.cur[i] * U, y = TOP + R0;
    if (st && st.kind === 'jump') { const x0 = st.from[i] * U; x = x0 * Math.cos(S.jumpTh); y = TOP + R0 + Math.abs(x0) * Math.sin(S.jumpTh); }
    BALL[i].position.set(x, y, ZL + DZ[i]);
    const lab = S.letters ? (i ? 'b' : 'a') : fmt(o), col = i ? C.cyan : C.mag;
    setTag(TAG[i], S.letters ? (S.atResult ? coefLabel(i) : lab) : fmt(S.cur[i]), col);
    TAG[i].position.set(x, y + 0.019 + (i === 0 && close ? 0.017 : 0), ZL); TAG[i].visible = !S.busy && S.t > 1.2;
    setTag(OTAG[i], lab, col); OTAG[i].position.set(o * U, TOP + 0.015 + (i === 0 && oclose ? 0.012 : 0), ZL + 0.004);
    OTAG[i].visible = S.t > 1.2 && (S.busy || (S.atResult && Math.abs(S.cur[i] - o) > 1e-6));
  }
  // 课本跟着亮
  G.open.userData.to = S.handed && S.a === S.b ? 0.4 : 0;
  G.sub.userData.to = S.handed && S.op === '−' ? 0.36 : 0;
  G.div.userData.to = S.handed && S.op === '÷' ? 0.36 : 0;
  G.note.userData.to = S.handed && ((S.op === '×' && S.c === 0 && S.atResult) || (S.noteUntil && S.noteUntil > S.t)) ? 0.42 : 0;
  G.rowN.userData.to = S.handed && !S.touchedC ? 0.18 + 0.2 * Math.sin(S.t * 2.6) ** 2 : 0;
  G.p1.userData.to = CONCL.add.userData.want ? 0.36 : 0; G.p2.userData.to = CONCL.pos.userData.want ? 0.36 : 0; G.p3.userData.to = CONCL.neg.userData.want ? 0.36 : 0;
  G.ex1.userData.to = S.letters && S.a > S.b && addOf(S.op, S.c) === 3 ? 0.4 : 0; G.ex2.userData.to = S.letters && S.a > S.b && mulOf(S.op, S.c) === -2 ? 0.4 : 0;
  for (const g of Object.values(G)) g.material.opacity += (g.userData.to - g.material.opacity) * Math.min(1, dt * 6);
  for (const m of [...CASES.map((k) => k.st), ...Object.values(CONCL)]) { if (m.userData.want) m.userData.on = Math.min(1, m.userData.on + dt / 0.25); const p = m.userData.on; m.material.opacity = p; m.scale.setScalar(1 + 0.6 * (1 - p) ** 2); }
  // 小纸条
  const r = ruler.getBoundingClientRect();
  const pb = panel.getBoundingClientRect(); tipC.style.left = r.left + 4 + 'px'; tipC.style.top = pb.top - tipC.offsetHeight - 12 + 'px'; tipC.style.opacity = S.handed && !S.touchedC ? 1 : 0; // 贴在纸片上方，指着下面的尺
  const pr = RING[0].position.clone().project(cam); tipB.style.left = ((pr.x + 1) / 2) * innerWidth - tipB.offsetWidth / 2 + 'px'; tipB.style.top = ((1 - pr.y) / 2) * innerHeight + 30 + 'px';
  tipB.style.opacity = S.handed && S.ops >= 2 && !S.touchedB && !S.busy ? 1 : 0;
}

window.__S = S;
window.__op = (op, c) => { touchC(); setOp(op, c); };
window.__drop = (a, b) => { S.a = a; S.b = b; S.touchedB = true; S.noteUntil = S.noteUntil || S.t + 3; run(); };
window.__ring = (i) => { const p = RING[i].position.clone().project(cam); return [((p.x + 1) / 2) * innerWidth, ((1 - p.y) / 2) * innerHeight]; };
window.__xy = (v) => { const p = V(v * U, TOP, ZL).project(cam); return [((p.x + 1) / 2) * innerWidth, ((1 - p.y) / 2) * innerHeight]; };

buildRuler(); showOp(); readout(false);
let last = performance.now();

  if (loaded >= 2 && !S.hold) S.t += dt;
