<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>活页课本</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M3 7q6-2 13 2v18q-7-4-13-2z%22 fill=%22%23f4ead8%22/%3E%3Cpath d=%22M29 7q-6-2-13 2v18q7-4 13-2z%22 fill=%22%23ff6a3d%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    // 从书里回到书架：书里最后一帧（合上的书）先盖在页面最上面，书架那边画好同一个画面再揭开（window.__dropSnap），换页面时不会白一下
    (function () {
      var d = document.documentElement;
      window.__dropSnap = function () {};
      try {
        var S = sessionStorage, snap = S.getItem('livebook.snap');
        if (S.getItem('livebook.homeFrom') && location.search.indexOf('book=') < 0) d.classList.add('to-home');
        if (!snap) return;
        S.removeItem('livebook.snap');
        d.classList.add('snap');
        var st = document.createElement('style'), block = location.hash.indexOf('via=block') >= 0;          // 从地理世界切出一块地形进来：等书里准备好的这一会儿，画面接着慢慢推近（不停在一张静止的图上），书里按推近了多少摆镜头（window.__snapScale）
        st.textContent = 'html.snap::after{content:"";position:fixed;inset:0;z-index:1000;pointer-events:none;background:#e9e1d3 url("' + snap + '") center/100% 100% no-repeat;transition:opacity ' + (block ? '.34s' : '.28s') + ' ease' + (block ? ';animation:snap-push 2.6s cubic-bezier(.45,0,.55,1) forwards}@keyframes snap-push{to{transform:scale(1.05)}' : '') + '}html.snap.snap-out::after{opacity:0}';
        document.head.appendChild(st);
        window.__snapScale = function () { var m = getComputedStyle(d, '::after').transform, k = m && m.indexOf('matrix(') === 0 ? parseFloat(m.slice(7)) || 1 : 1; st.textContent += 'html.snap::after{animation:none;transform:scale(' + k + ')}'; return k; };          // 停在现在推近的地方，返回推近了多少倍
        window.__dropSnap = function () { d.classList.add('snap-out'); setTimeout(function () { d.classList.remove('snap', 'snap-out'); st.remove(); }, block ? 380 : 320); };
        setTimeout(window.__dropSnap, 4000);          // 万一那边出了错，不能一直盖着
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <canvas id="c" tabindex="0" aria-label="3D 课本"></canvas>

  <div id="loader">
    <div class="loader-book"><i></i><i></i><i></i></div>
    <p class="loader-title">活页课本</p>
    <p class="loader-msg">正在翻开书本…</p>
    <div class="loader-bar"><i></i></div>
  </div>

  <header id="hud-top">
    <div class="brand"><b>活页课本</b><span id="book-title"></span></div>
    <div class="hud-actions">
      <button id="btn-shelf" class="chip" title="回到书桌，换一本书">‹ 书桌</button>
      <button id="btn-globe" class="chip" title="地球目录：这本书的活页都在地球上" hidden>地球</button>
      <button id="btn-toc" class="chip" title="目录 (T)">目录</button>
      <button id="btn-live" class="chip chip-live" title="这本书的活页">✦ 活页 <em id="stamp-count">0/0</em></button>
    </div>
  </header>

  <nav id="hud-pager">
    <button id="btn-prev" class="round" title="上一页 (←)" aria-label="上一页">‹</button>
    <span id="page-label">封面</span>
    <button id="btn-next" class="round" title="下一页 (→)" aria-label="下一页">›</button>
  </nav>

  <p id="hint">点击或拖动书页翻页 · 发光的图是一张活页，点一下翻开</p>

  <aside id="drawer" hidden>
    <div class="drawer-head"><h2 id="drawer-title">目录</h2><button class="x" data-close>×</button></div>
    <div id="drawer-body"></div>
  </aside>

  <section id="panel" hidden></section>

  <footer id="copy">课本页面来自本地教材文件，仅供个人学习使用</footer>
  <noscript><p style="position:fixed;inset:25%;z-index:9999;background:#fffdf8;padding:24px;color:#23293a">请将文件下载到电脑，用新版 Chrome 或 Edge 打开。聊天软件的文件预览无法运行实验。</p></noscript>
  <script>
    window.addEventListener('error', function (event) {
      var loader = document.getElementById('loader');
      if (!loader || loader.classList.contains('done')) return;
      var message = loader.querySelector('.loader-msg');
      if (message) message.textContent = (location.protocol === 'file:' ? '启动失败。请将文件解压到电脑，用新版 Chrome 或 Edge 打开，勿在聊天软件内预览。' : '这个浏览器打不开活页课本的 3D 画面。请换新版的 Chrome、Edge 或 Safari 再试（用电脑打开最好）。') + '错误：' + (event.message || '组件加载失败');
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
